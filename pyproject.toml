[project]
name = "yt-paw"
version = "0.1.1"
description = "Local-first Qt frontend for pluggable download engines (MIT)"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
  "PySide6==6.11.2",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-qt==4.5.0",
  "ruff==0.16.8",
  "mypy==2.3.1",
]
build = [
  "pyinstaller==6.22.3",
  "pyinstaller-hooks-contrib==2026.8",
  "setuptools==84.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
pythonpath = ["src"]

[project.scripts]
yt-paw = "ytpaw.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytpaw"]
