name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    # Pin for release glibc compatibility; ubuntu-latest is 26.04 as of 2026-10.
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shm0 libxcb-sync1 libxcb-glx0 \
            libxcb-xkb1 fontconfig

      - name: Check release tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/ytpaw/__init__.py)
          project_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ -z "$version" ] || [ "$version" != "$project_version" ]; then
            echo "version mismatch: __version__=${version:-missing} pyproject=${project_version:-missing}" >&2
            exit 1
          fi
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version v$version" >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run ruff check src tests packaging
      - run: uv run mypy src tests
      - run: uv run pytest -q -p no:cacheprovider

  windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --group build

      - uses: actions/cache@v4
        with:
          path: build/sidecar-cache
          key: sidecars-windows-x86_64-${{ hashFiles('packaging/sidecars.lock.json') }}

      - name: Build standalone bundle
        run: uv run --group build python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: yt-paw-windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  linux:
    needs: quality
    # Build on the oldest supported glibc, not the moving ubuntu-latest image.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-randr0 libxcb-render0 libxcb-shm0 libxcb-sync1 libxcb-glx0 \
            libxcb-xkb1 fontconfig

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --group build

      - uses: actions/cache@v4
        with:
          path: build/sidecar-cache
          key: sidecars-linux-x86_64-${{ hashFiles('packaging/sidecars.lock.json') }}

      - name: Build standalone bundle
        run: uv run --group build python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: yt-paw-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: yt-paw ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
